spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iso20022_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${Mari@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

investigation.rules.supported-currencies=AED,USD,EUR,GBP
investigation.rules.repeated-failure-threshold=3
investigation.rules.recent-failure-window-days=90
investigation.rules.amount-anomaly-multiplier=3.0
historical-analysis.window-days=${HISTORICAL_ANALYSIS_WINDOW_DAYS:90}
risk-agent.critical-points=${RISK_AGENT_CRITICAL_POINTS:80}
risk-agent.high-points=${RISK_AGENT_HIGH_POINTS:50}
risk-agent.medium-points=${RISK_AGENT_MEDIUM_POINTS:25}
risk-agent.low-points=${RISK_AGENT_LOW_POINTS:10}
risk-agent.score-cap=${RISK_AGENT_SCORE_CAP:100}
risk-agent.critical-threshold=${RISK_AGENT_CRITICAL_THRESHOLD:80}
risk-agent.high-threshold=${RISK_AGENT_HIGH_THRESHOLD:50}
risk-agent.medium-threshold=${RISK_AGENT_MEDIUM_THRESHOLD:20}
risk-agent.confidence-threshold=${RISK_AGENT_CONFIDENCE_THRESHOLD:0.70}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:7b}
ollama.temperature=${OLLAMA_TEMPERATURE:0.1}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:90}
reasoning.prompt-version=${REASONING_PROMPT_VERSION:1.0}
